<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Elo Matchup Predictor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --bg4: #222222;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --red: #e8373a;
    --red-dim: rgba(232,55,58,0.15);
    --blue: #3a8de8;
    --blue-dim: rgba(58,141,232,0.15);
    --gold: #c9a227;
    --green: #3a9e5f;
    --radius: 6px;
    --radius-lg: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  .topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 52px;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot { color: var(--red); }
  .badge { font-size: 10px; background: var(--red-dim); color: var(--red); padding: 2px 8px; border-radius: 20px; border: 1px solid var(--red); letter-spacing: 0.05em; font-weight: 500; }
  .fighter-count { font-size: 12px; color: var(--text3); margin-left: auto; }

  .main { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 4px;
    width: fit-content;
  }

  .tab {
    padding: 7px 18px;
    font-size: 13px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }

  .tab.active { background: var(--red); color: #fff; }
  .tab:hover:not(.active) { color: var(--text); background: var(--bg3); }

  .panel { display: none; }
  .panel.active { display: block; }

  .div-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 14px;
  }

  .div-btn {
    padding: 4px 12px;
    font-size: 11px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: 1px solid var(--border2);
    border-radius: 20px;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }

  .div-btn.active { background: var(--bg3); color: var(--text); border-color: var(--border2); }
  .div-btn:hover:not(.active) { border-color: var(--border2); color: var(--text); }

  .search-row { margin-bottom: 14px; }
  .search-row input {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-row input:focus { border-color: var(--border2); }
  .search-row input::placeholder { color: var(--text3); }

  .corners {
    display: grid;
    grid-template-columns: 1fr 50px 1fr;
    gap: 12px;
    align-items: start;
    margin-bottom: 14px;
  }

  .corner-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px;
  }

  .corner-card.red-card { border-top: 2px solid var(--red); }
  .corner-card.blue-card { border-top: 2px solid var(--blue); }

  .corner-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .label-red { color: var(--red); }
  .label-blue { color: var(--blue); }

  .corner-card select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    padding: 7px 10px;
    margin-bottom: 10px;
    outline: none;
    cursor: pointer;
  }

  .f-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
    margin-bottom: 4px;
  }

  .f-meta {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }

  .elo-n { font-weight: 600; color: var(--gold); }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .stat-box { background: var(--bg3); border-radius: var(--radius); padding: 6px 8px; }
  .stat-label { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
  .stat-val { font-size: 13px; font-weight: 500; color: var(--text); }

  .form-bar { display: flex; gap: 3px; margin-top: 8px; }
  .fd {
    width: 16px; height: 16px; border-radius: 50%;
    font-size: 8px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .fd-w { background: rgba(58,158,95,0.2); color: #3a9e5f; border: 1px solid rgba(58,158,95,0.4); }
  .fd-l { background: rgba(232,55,58,0.2); color: var(--red); border: 1px solid rgba(232,55,58,0.3); }
  .fd-n { background: var(--bg4); color: var(--text3); border: 1px solid var(--border); }

  .vs-col { display: flex; align-items: center; justify-content: center; padding-top: 2rem; }
  .vs-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text3);
    letter-spacing: 0.05em;
  }

  .predict-btn {
    width: 100%;
    padding: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid var(--red);
    border-radius: var(--radius);
    background: var(--red-dim);
    color: var(--red);
    cursor: pointer;
    margin-bottom: 20px;
    transition: all 0.15s;
  }
  .predict-btn:hover { background: var(--red); color: #fff; }

  .section {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }

  .sec-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--text3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .win-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .win-name { font-size: 13px; font-weight: 500; color: var(--text); min-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-wrap { flex: 1; height: 8px; background: var(--bg4); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .bar-red { background: var(--red); }
  .bar-blue { background: var(--blue); }
  .win-pct { font-size: 14px; font-weight: 600; color: var(--text); min-width: 38px; text-align: right; }
  .fav-tag { font-size: 9px; padding: 1px 6px; background: rgba(201,162,39,0.15); color: var(--gold); border: 1px solid var(--gold); border-radius: 20px; margin-left: 4px; font-weight: 600; letter-spacing: 0.04em; }

  .outcome-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .oc { background: var(--bg3); border-radius: var(--radius); padding: 12px; text-align: center; }
  .oc-icon { font-size: 20px; margin-bottom: 5px; }
  .oc-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
  .oc-pct { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; color: var(--text); }
  .oc-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }

  .bk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bk { background: var(--bg3); border-radius: var(--radius); padding: 12px; }
  .bk-name { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .bk-row:last-child { border-bottom: none; }
  .bk-l { color: var(--text2); }
  .bk-v { font-weight: 600; color: var(--text); }

  .warn { font-size: 11px; color: #c9a227; margin-top: 6px; opacity: 0.85; }
  .reach-note { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .elo-gap { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .su { color: var(--green); font-size: 11px; font-weight: 600; }
  .sd { color: var(--red); font-size: 11px; font-weight: 600; }

  /* Rankings */
  .rank-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rank-table th {
    text-align: left;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
  }
  .rank-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .rank-table tr:last-child td { border-bottom: none; }
  .rank-table tr:hover td { background: var(--bg3); }
  .rank-num { color: var(--text3); font-weight: 600; width: 28px; }
  .rank-name { font-weight: 600; color: var(--text); }
  .elo-pill { padding: 3px 9px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 20px; font-weight: 600; font-size: 12px; color: var(--gold); }

  /* Simulate */
  .sim-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .sim-controls select {
    flex: 1; min-width: 140px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    padding: 7px 10px;
    outline: none;
  }
  .sim-btn {
    padding: 8px 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    background: var(--bg3);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .sim-btn:hover { border-color: var(--red); color: var(--red); }
  .sim-btn.go { border-color: var(--red); background: var(--red-dim); color: var(--red); }
  .sim-btn.go:hover { background: var(--red); color: #fff; }

  .sim-log-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; flex-wrap: wrap; }
  .sim-log-row:last-child { border-bottom: none; }
  .w-tag { background: rgba(58,158,95,0.15); color: var(--green); border: 1px solid rgba(58,158,95,0.3); padding: 1px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; flex-shrink: 0; letter-spacing: 0.04em; }
  .sim-winner { font-weight: 600; color: var(--text); }
  .sim-loser { color: var(--text2); }
  .sim-method { color: var(--text3); font-size: 11px; }
  .elo-chg { margin-left: auto; display: flex; gap: 8px; }

  /* Custom autocomplete fighter picker */
  .fighter-picker { position: relative; width: 100%; margin-bottom: 10px; }
  .fighter-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    padding: 8px 32px 8px 10px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .fighter-input:focus { border-color: var(--border2); }
  .fighter-input::placeholder { color: var(--text3); }
  .picker-arrow {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text3); font-size: 10px; pointer-events: none;
  }
  .fighter-dropdown {
    position: absolute; top: calc(100% + 3px); left: 0; right: 0;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    max-height: 240px;
    overflow-y: auto;
    z-index: 1000;
    display: none;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }
  .fighter-dropdown.open { display: block; }
  .dropdown-item {
    padding: 8px 10px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover, .dropdown-item.highlighted { background: var(--bg3); }
  .dropdown-item.selected { background: var(--bg3); }
  .di-name { font-weight: 500; color: var(--text); flex: 1; }
  .di-name mark { background: none; color: var(--red); font-weight: 700; }
  .di-div { font-size: 10px; color: var(--text3); white-space: nowrap; }
  .di-elo { font-size: 10px; color: var(--gold); font-weight: 600; white-space: nowrap; }
  .dropdown-empty { padding: 12px 10px; font-size: 12px; color: var(--text3); text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    &#9650; UFC <span class="logo-dot">ELO</span>
  </div>
  <span class="badge">PREDICTOR</span>
  <span class="fighter-count" id="fCount"></span>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('predict')">Predict</button>
    <button class="tab" onclick="switchTab('rankings')">Rankings</button>
    <button class="tab" onclick="switchTab('simulate')">Simulate</button>
  </div>

  <!-- PREDICT -->
  <div id="panel-predict" class="panel active">
    <div class="div-filter" id="divFilter"></div>
    <div class="corners">
      <div class="corner-card red-card">
        <div class="corner-label label-red">&#9632; Red Corner</div>
        <div class="fighter-picker" id="pickerA">
          <input class="fighter-input" id="inputA" type="text" placeholder="Search fighter…" autocomplete="off" oninput="onPickerInput('A')" onfocus="openPicker('A')" onkeydown="onPickerKey(event,'A')">
          <span class="picker-arrow">&#9660;</span>
          <div class="fighter-dropdown" id="dropA"></div>
        </div>
        <div id="infoA"></div>
      </div>
      <div class="vs-col"><span class="vs-text">VS</span></div>
      <div class="corner-card blue-card">
        <div class="corner-label label-blue">&#9632; Blue Corner</div>
        <div class="fighter-picker" id="pickerB">
          <input class="fighter-input" id="inputB" type="text" placeholder="Search fighter…" autocomplete="off" oninput="onPickerInput('B')" onfocus="openPicker('B')" onkeydown="onPickerKey(event,'B')">
          <span class="picker-arrow">&#9660;</span>
          <div class="fighter-dropdown" id="dropB"></div>
        </div>
        <div id="infoB"></div>
      </div>
    </div>
    <button class="predict-btn" onclick="runPredict()">&#9654; Analyse Matchup</button>
    <div id="results"></div>
  </div>

  <!-- RANKINGS -->
  <div id="panel-rankings" class="panel">
    <div class="div-filter" id="rankDivFilter"></div>
    <div class="section">
      <div class="sec-title" id="rankTitle">Rankings</div>
      <table class="rank-table">
        <thead><tr>
          <th>#</th><th>Fighter</th><th>Elo</th><th>Record</th><th>Streak</th><th>Form</th>
        </tr></thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
  </div>

  <!-- SIMULATE -->
  <div id="panel-simulate" class="panel">
    <div class="section">
      <div class="sec-title">Live Elo Simulation</div>
      <p style="font-size:12px;color:var(--text2);margin-bottom:12px">Simulate fights — Elo ratings, records and form update in real time</p>
      <div class="sim-controls">
        <select id="simA"></select>
        <span style="font-size:12px;color:var(--text3)">vs</span>
        <select id="simB"></select>
        <select id="simMethod">
          <option value="auto">Random outcome</option>
          <option value="ko">Force KO/TKO</option>
          <option value="sub">Force Submission</option>
          <option value="dec">Force Decision</option>
        </select>
        <button class="sim-btn go" onclick="simFight()">&#9654; Simulate</button>
        <button class="sim-btn" onclick="resetElo()">&#8635; Reset</button>
      </div>
      <div id="simLog"></div>
    </div>
  </div>
</div>

function eloProb(a,b){return 1/(1+Math.pow(10,(b-a)/400));}
function getF(n){return fighters.find(f=>f.name===n);}
function formScore(form){
  if(!form)return 0;
  let s=0;const chars=[...form];
  chars.forEach((c,i)=>{const w=chars.length-i;if(c==='W')s+=w;else if(c==='L')s-=w;});
  return s/(chars.length*(chars.length+1)/2);
}

// Weight class order — heavier = higher index = size advantage
const DIV_WEIGHT = {
  "Women's Strawweight":0, "Women's Flyweight":1, "Women's Bantamweight":2,
  "Flyweight":3, "Bantamweight":4, "Featherweight":5,
  "Lightweight":6, "Welterweight":7, "Middleweight":8,
  "Light Heavyweight":9, "Heavyweight":10
};
function isWomenDiv(div){ return div.startsWith("Women's"); }

// Returns {prob, eloBonus, note}
// eloBonus added to A's effective Elo based on weight/gender advantage
function sizeBonus(fA, fB){
  const wA = DIV_WEIGHT[fA.div] ?? 5;
  const wB = DIV_WEIGHT[fB.div] ?? 5;
  const genderA = isWomenDiv(fA.div);
  const genderB = isWomenDiv(fB.div);

  // Same division — no bonus
  if(fA.div === fB.div) return {bonus:0, note:null, block:false};

  // Man vs woman — show warning, apply huge Elo bonus to the man
  if(genderA !== genderB){
    const manIsA = !genderA;
    return {
      bonus: manIsA ? 600 : -600,  // ~99% win for the man at equal Elo
      note: '⚠️ Men are biologically larger and stronger — this matchup would not happen in sanctioned MMA.',
      block: false
    };
  }

  // Same gender, different weight class
  const diff = wA - wB;  // positive = A is heavier
  // Each weight class step is roughly 10-15 lbs. Model: 60 Elo per step.
  const bonus = diff * 60;
  let note = null;
  if(Math.abs(diff) === 1) note = `${diff>0?fA.name:fB.name} comes from a heavier division — size advantage applies.`;
  if(Math.abs(diff) === 2) note = `${diff>0?fA.name:fB.name} has a significant size advantage (2 weight classes).`;
  if(Math.abs(diff) >= 3)  note = `${diff>0?fA.name:fB.name} has a massive size advantage (${Math.abs(diff)} weight classes) — result heavily skewed.`;
  return {bonus, note, block:false};
}

function adjProb(fA, fB){
  const base = eloProb(fA.elo, fB.elo);
  const form = (formScore(fA.form) - formScore(fB.form)) * 0.05;
  const {bonus} = sizeBonus(fA, fB);
  // Apply size bonus as additional Elo shift
  const sizeAdj = bonus / 400 * Math.log(10) * eloProb(fA.elo, fB.elo) * (1 - eloProb(fA.elo, fB.elo));
  return Math.min(.99, Math.max(.01, base + form + sizeAdj));
}

function simFight(){
  const nA=document.getElementById('simA').value,nB=document.getElementById('simB').value;
  if(nA===nB)return;
  const fA=getF(nA),fB=getF(nB);
  const pA=adjProb(fA,fB);
  const winnerIsA=Math.random()<pA;
  const winner=winnerIsA?fA:fB,loser=winnerIsA?fB:fA;
  const forced=document.getElementById('simMethod').value;
  let method;
  if(forced==='ko')method='KO/TKO';
  else if(forced==='sub')method='Submission';
  else if(forced==='dec')method='Decision';
  else{
    const r=Math.random(),finRate=winner.ko+winner.sub;
    if(r<winner.ko)method='KO/TKO';
    else if(r<finRate)method='Submission';
    else method='Decision';
  }
  const round=method==='Decision'?5:Math.ceil(Math.random()*3);
  const K=28*(method==='Decision'?1:1.25);
  const exp=winnerIsA?pA:1-pA;
  const gain=Math.round(K*(1-exp)),loss=Math.round(K*exp);
  winner.elo+=gain;loser.elo=Math.max(1400,loser.elo-loss);
  winner.w+=1;loser.l+=1;
  winner.streak=winner.streak>0?winner.streak+1:1;
  loser.streak=loser.streak<0?loser.streak-1:-1;
  winner.form=(winner.form+'W').slice(-5);
  loser.form=(loser.form+'L').slice(-5);
  simLog.unshift({w:winner.name,l:loser.name,method,round,gain,loss});
  if(simLog.length>10)simLog.pop();
  document.getElementById('simLog').innerHTML=simLog.map(r=>`
    <div class="sim-log-row">
      <span class="w-tag">WIN</span>
      <span class="sim-winner">${r.w}</span>
      <span class="sim-loser">def. ${r.l}</span>
      <span class="sim-method">${r.method}, R${r.round}</span>
      <span class="elo-chg"><span class="su">+${r.gain}</span><span class="sd">-${r.loss}</span></span>
    </div>`).join('');
}

const pickerState = {
  A: { selected: null, highlighted: -1, query: '' },
  B: { selected: null, highlighted: -1, query: '' },
};

function shortDivLabel(d){
  return d.replace("Women's ","W.").replace("Light Heavyweight","LHW").replace("Heavyweight","HW")

    .replace("Featherweight","FW").replace("Bantamweight","BW").replace("Flyweight","FLY").replace("Strawweight","STR");

function getFilteredForPicker(side){
  const q = pickerState[side].query.toLowerCase().trim();
  let list = fighters;
  if(activeDivFilter !== "All") list = list.filter(f => f.div === activeDivFilter);
  if(q) list = list.filter(f => f.name.toLowerCase().includes(q));
  else list = [...list].sort((a,b) => b.elo - a.elo);
  return list;
}

function highlightMatch(name, q){
  if(!q) return name;
  const idx = name.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return name;
  return name.slice(0,idx) + '<mark>' + name.slice(idx, idx+q.length) + '</mark>' + name.slice(idx+q.length);
}

function renderDropdown(side){
  const st = pickerState[side];
  const drop = document.getElementById('drop'+side);
  const list = getFilteredForPicker(side);
  if(!list.length){
    drop.innerHTML = '<div class="dropdown-empty">No fighters found</div>';
    return;
  }
  drop.innerHTML = list.map((f,i) => {
    const isSel = st.selected === f.name;
    const isHi  = i === st.highlighted;
    return `<div class="dropdown-item${isSel?' selected':''}${isHi?' highlighted':''}"
      onmousedown="selectFighter('${side}','${f.name.replace(/'/g,"&#39;")}')"
      onmouseover="pickerState['${side}'].highlighted=${i};renderDropdown('${side}')">
      <span class="di-name">${highlightMatch(f.name, st.query)}</span>
      <span class="di-div">${shortDivLabel(f.div)}</span>
      <span class="di-elo">${f.elo}</span>
    </div>`;
  }).join('');
  // Scroll highlighted item into view
  if(st.highlighted >= 0){
    const items = drop.querySelectorAll('.dropdown-item');
    if(items[st.highlighted]) items[st.highlighted].scrollIntoView({block:'nearest'});
  }
}

function openPicker(side){
  pickerState[side].highlighted = -1;
  const drop = document.getElementById('drop'+side);
  drop.classList.add('open');
  renderDropdown(side);
}

function closePicker(side){
  const drop = document.getElementById('drop'+side);
  drop.classList.remove('open');
  // Restore input to selected fighter name if nothing valid typed
  const st = pickerState[side];
  if(st.selected){
    document.getElementById('input'+side).value = st.selected;
  }
}

function selectFighter(side, name){
  const st = pickerState[side];
  st.selected = name;
  st.query = '';
  document.getElementById('input'+side).value = name;
  document.getElementById('drop'+side).classList.remove('open');
  renderCard('info'+side, name);
  document.getElementById('results').innerHTML = '';
}

function onPickerInput(side){
  const inp = document.getElementById('input'+side);
  pickerState[side].query = inp.value;
  pickerState[side].highlighted = -1;
  openPicker(side);
}

function onPickerKey(e, side){
  const st = pickerState[side];
  const drop = document.getElementById('drop'+side);
  const list = getFilteredForPicker(side);
  if(!drop.classList.contains('open')){ openPicker(side); return; }
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    st.highlighted = Math.min(st.highlighted + 1, list.length - 1);
    renderDropdown(side);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    st.highlighted = Math.max(st.highlighted - 1, 0);
    renderDropdown(side);
  } else if(e.key === 'Enter'){
    e.preventDefault();
    const pick = st.highlighted >= 0 ? list[st.highlighted] : list[0];
    if(pick) selectFighter(side, pick.name);
  } else if(e.key === 'Escape'){
    closePicker(side);
  }
}

  const formAdj = (formScore(fA.form) - formScore(fB.form)) * 0.05;

  // Build context notes
  let contextNotes = '';
  if(sizeNote){
    const isGender = isWomenDiv(fA.div) !== isWomenDiv(fB.div);
    contextNotes += `<div class="warn" style="${isGender?'border-color:#e74;color:#e74;':''}">&#9888; ${sizeNote}</div>`;
  } else if(fA.div !== fB.div){

  }

  document.getElementById('results').innerHTML=`
    <div class="section">
      <div class="sec-title">Win Probability <span style="font-weight:400;text-transform:none;letter-spacing:0">(Elo + form + size)</span></div>
      <div class="win-row"><span class="win-name">${fA.name}${favA?'<span class="fav-tag">FAV</span>':''}</span><div class="bar-wrap"><div class="bar-fill bar-red" style="width:${pAr}%"></div></div><span class="win-pct">${pAr}%</span></div>
      <div class="win-row"><span class="win-name">${fB.name}${!favA?'<span class="fav-tag">FAV</span>':''}</span><div class="bar-wrap"><div class="bar-fill bar-blue" style="width:${pBr}%"></div></div><span class="win-pct">${pBr}%</span></div>
      <div class="elo-gap">Elo gap: ${diff} pts${bonus!==0?` &nbsp;|&nbsp; Size adjustment: ${bonus>0?'+':''}${bonus} pts`:''}</div>${rNote}${contextNotes}
    </div>
    <div class="section">
      <div class="sec-title">How Does the Fight End?</div>
      <div class="outcome-grid">
        <div class="oc"><div class="oc-icon" style="color:var(--red)">&#9889;</div><div class="oc-label">KO / TKO</div><div class="oc-pct">${tKO}%</div><div class="oc-sub">Striking finish</div></div>
        <div class="oc"><div class="oc-icon" style="color:#7b6fd8">&#9900;</div><div class="oc-label">Submission</div><div class="oc-pct">${tSub}%</div><div class="oc-sub">Ground finish</div></div>
        <div class="oc"><div class="oc-icon" style="color:var(--green)">&#9878;</div><div class="oc-label">Decision</div><div class="oc-pct">${tDec}%</div><div class="oc-sub">Goes to judges</div></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-title">Per-Fighter Breakdown</div>
      <div class="bk-grid">
        <div class="bk"><div class="bk-name" style="color:var(--red)">${fA.name}</div>
          <div class="bk-row"><span class="bk-l">Win by KO/TKO</span><span class="bk-v">${aKO}%</span></div>
          <div class="bk-row"><span class="bk-l">Win by submission</span><span class="bk-v">${aSub}%</span></div>
          <div class="bk-row"><span class="bk-l">Win by decision</span><span class="bk-v">${aDec}%</span></div>
          <div class="bk-row"><span class="bk-l">Any loss</span><span class="bk-v">${pBr}%</span></div>
          <div class="bk-row"><span class="bk-l">Reach</span><span class="bk-v">${fA.reach}"</span></div>
        </div>
        <div class="bk"><div class="bk-name" style="color:var(--blue)">${fB.name}</div>
          <div class="bk-row"><span class="bk-l">Win by KO/TKO</span><span class="bk-v">${bKO}%</span></div>
          <div class="bk-row"><span class="bk-l">Win by submission</span><span class="bk-v">${bSub}%</span></div>
          <div class="bk-row"><span class="bk-l">Win by decision</span><span class="bk-v">${bDec}%</span></div>
          <div class="bk-row"><span class="bk-l">Any loss</span><span class="bk-v">${pAr}%</span></div>
          <div class="bk-row"><span class="bk-l">Reach</span><span class="bk-v">${fB.reach}"</span></div>
        </div>
      </div>
    </div>`;
}

// ── Init ──────────────────────────────────────────────────────
buildDivFilter('divFilter', DIVS, activeDivFilter, d=>{ activeDivFilter=d; applyFilter(); });
buildDivFilter('rankDivFilter', DIVS.filter(d=>d!=="All"), activeRankDiv, d=>{ activeRankDiv=d; renderRankings(); });

// Pre-select first two fighters by Elo
const _init = fighters.slice().sort((a,b)=>b.elo-a.elo);
selectFighter('A', _init[0].name);
selectFighter('B', _init[1].name);
document.getElementById('fCount').textContent = fighters.length + ' fighters';

// ── Live UFCStats record sync ─────────────────────────────────
// Fetches fresh W/L records directly from ufcstats.com and patches the roster.
// Uses allorigins.win as a CORS proxy so this works from a local HTML file.
// Runs in the background — UI is instantly usable from static data while sync runs.

const CORS = 'https://api.allorigins.win/raw?url=';
const UFS_BASE = 'http://ufcstats.com/statistics/fighters?char=';
const UFS_SUFFIX = '&page=all';
const LETTERS = 'abcdefghijklmnopqrstuvwxyz';

// Build a lookup map: lowercase name → fighter object
const nameMap = {};
fighters.forEach(f => { nameMap[f.name.toLowerCase()] = f; });

// Also try lastname-first matching
fighters.forEach(f => {
  const parts = f.name.split(' ');
  if(parts.length >= 2){
    const rev = (parts[parts.length-1]+' '+parts.slice(0,-1).join(' ')).toLowerCase();
    if(!nameMap[rev]) nameMap[rev] = f;
  }
});

let syncDone = 0, syncTotal = 0, syncUpdated = 0;

function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  if(syncDone < syncTotal){
    el.textContent = `Syncing records… ${syncDone}/${syncTotal}`;
    el.style.color = 'var(--gold)';
  } else {
    el.textContent = `✓ Records live from UFCStats (${syncUpdated} updated)`;
    el.style.color = 'var(--green)';
    // Refresh currently displayed fighter cards
    if(pickerState.A.selected) renderCard('infoA', pickerState.A.selected);
    if(pickerState.B.selected) renderCard('infoB', pickerState.B.selected);
  }
}

function parseUFSPage(html){
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const rows = doc.querySelectorAll('tbody tr');
  const results = [];
  rows.forEach(row => {
    const cols = row.querySelectorAll('td');
    if(cols.length < 10) return;
    const firstName = (cols[0].textContent||'').trim();
    const lastName  = (cols[1].textContent||'').trim();
    const name = `${firstName} ${lastName}`.trim();
    const wins   = parseInt((cols[7].textContent||'0').trim()) || 0;
    const losses = parseInt((cols[8].textContent||'0').trim()) || 0;
    const draws  = parseInt((cols[9].textContent||'0').trim()) || 0;
    if(name) results.push({ name, wins, losses, draws });
  });
  return results;
}

async function fetchLetter(letter){
  try {
    const targetUrl = UFS_BASE + letter + UFS_SUFFIX;
    const url = CORS + encodeURIComponent(targetUrl);
    const resp = await fetch(url, { signal: AbortSignal.timeout(15000) });
    if(!resp.ok) return;
    const html = await resp.text();
    const rows = parseUFSPage(html);
    rows.forEach(({ name, wins, losses, draws }) => {
      const key = name.toLowerCase();
      const f = nameMap[key];
      if(f){
        if(f.w !== wins || f.l !== losses){
          f.w = wins; f.l = losses;
          if(draws > 0) f.draws = draws;
          syncUpdated++;
        }
      }
    });
  } catch(e) {
    // silently skip — network may be unavailable
  } finally {
    syncDone++;
    updateSyncBadge();
  }
}

async function runLiveSync(){
  // Stagger requests to be polite — 26 letters × 500ms = ~13s total
  syncTotal = LETTERS.length;
  for(const letter of LETTERS){
    fetchLetter(letter);
    await new Promise(r => setTimeout(r, 500));
  }
}

// Inject sync status badge into topbar
document.querySelector('.topbar').insertAdjacentHTML('beforeend',
  '<span id="syncBadge" style="font-size:11px;color:var(--text3);margin-left:auto">Syncing live records from UFCStats…</span>'
);

// Remove the existing fCount margin-left:auto so it doesn't conflict
const fc = document.getElementById('fCount');
if(fc) fc.style.marginLeft = '8px';

// Kick off background sync
setTimeout(runLiveSync, 1500);
</script>
